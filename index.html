<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Expense Tracker</h1>
        <p class="subtitle">Track your daily expenses easily</p>

        <div class="form-box">

            <label>Expense Name</label>
            <input type="text" id="expenseName" placeholder="Enter expense name">

            <label>Amount (₹)</label>
            <input type="number" id="expenseAmount" placeholder="Enter amount">

            <label>Category</label>
            <select id="expenseCategory">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <label>Date</label>
            <input type="date" id="expenseDate">

            <button onclick="addExpense()">Add Expense</button>

        </div>

        <div class="total-box">
            <h2>Total Expenses</h2>
            <p>₹<span id="totalAmount">0</span></p>
        </div>

        <h2>Expense Records</h2>

        <table>
            <thead>
                <tr>
                    <th>Expense</th>
                    <th>Amount</th>
                    <th>Category</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="expenseList">
            </tbody>
        </table>

    </div>

    <script src="script.js"></script>

</body>
</html>
